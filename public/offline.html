<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال — الرشودي للعقارات</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Tajawal, "IBM Plex Sans Arabic", system-ui, sans-serif;
        background: #faf7f5;
        color: #2a2422;
      }
      .card {
        text-align: center;
        padding: 32px;
        max-width: 420px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; color: #8c1d18; }
      p { font-size: 14px; line-height: 1.9; color: #6b625f; margin: 0 0 20px; }
      button {
        border: 0;
        background: #8c1d18;
        color: #fff;
        padding: 10px 22px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>التطبيق مثبّت ويعمل، لكن هذه الصفحة تحتاج اتصالًا لتحديث البيانات. تحقق من الشبكة ثم أعد المحاولة.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
